backend:
  name: github
  repo: nickc5115/jakedillon
  branch: main
  base_url: https://jakedillonmusic-cms-oauth.onrender.com
  auth_endpoint: /auth

media_folder: "resources/images/gallery"
public_folder: "/resources/images/gallery"

collections:
  - name: "events"
    label: "Events"
    folder: "events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", time_format: false }
      - { label: "Time Range", name: "time_range", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "body", widget: "markdown" }
      - { label: "Link (optional)", name: "link", widget: "string", required: false } 